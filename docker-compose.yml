version: "3.9"

services:
  agent:
    build: .
    ports:
      # Solo loopback del host: sin esto, Docker bindea "8000:8000" a
      # 0.0.0.0 por defecto, exponiendo la API del agente (incluida
      # /self-modification/apply) a cualquier dispositivo de la LAN, no
      # solo a esta máquina (hallazgo de la revisión de seguridad de
      # 2026-07-09). El token administrativo (ver utils/admin_token.py)
      # es una segunda capa por si este binding cambia en el futuro.
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./config:/app/config:ro          # config solo lectura
      - ./data:/app/data                  # persistencia memoria mediano/largo plazo
      - ./logs:/app/logs
    depends_on:
      - vector_store
    networks:
      - agent_net
    # El agente NO tiene acceso directo al socket de Docker — y, desde
    # el fix de M-11 (auditoría externa Likay-OS, 2026-09-26), tampoco
    # comparte RED con quien sí lo tiene (`sandbox_runner`/
    # `docker_socket_proxy`, ver `sandbox_net` más abajo). Antes de este
    # fix, `docker_socket_proxy` no tenía NINGUNA autenticación propia
    # y vivía en `agent_net`, la MISMA red que `agent` — un `agent`
    # comprometido (cualquier RCE futura, ninguna hoy conocida) podía
    # conectarse directo a `docker_socket_proxy:2375` y hablarle a
    # Docker él mismo, sin pasar por `sandbox_runner` ni por ningún
    # código de agent_core.
    #
    # NOTA DE ARQUITECTURA (encontrada al investigar este fix, sin
    # relación directa con M-11 pero real): kernel/lifecycle/executor.py
    # habla con Docker DIRECTO vía el SDK de Python (docker.from_env()),
    # nunca por HTTP a sandbox_runner — y el servicio `agent` de este
    # compose no monta el socket de Docker ni define DOCKER_HOST, así
    # que ese camino no puede conectarse a nada en este despliegue
    # containerizado tal como está hoy (sí funciona en el modo de
    # desarrollo de scripts/run_kal.sh, un solo proceso con acceso
    # directo al Docker real del host). Separar las redes acá no rompe
    # ningún camino que hoy funcione de verdad en docker-compose — deja
    # además más visible que conectar `agent` con `sandbox_runner` de
    # verdad requeriría una decisión de red explícita, no un efecto
    # secundario de compartir `agent_net` sin querer.

  # Recomendación de una auditoría externa (2026-08-24, ver
  # docs/HISTORY.md): interponer un proxy de control entre
  # `sandbox_runner` y el daemon de Docker real, en vez de montarle el
  # socket directo — reduce a qué PARTES de la API de Docker puede
  # llegar `sandbox_runner` si su propio proceso alguna vez se
  # compromete (nunca necesita Swarm/secrets/plugins/auth/volumes/redes
  # para hacer su trabajo, ver kernel/lifecycle/docker_runner.py).
  #
  # LÍMITE VERIFICADO EN VIVO, no asumido: este proxy filtra por
  # PREFIJO DE URL/tipo de recurso (CONTAINERS, IMAGES, etc.), nunca
  # inspecciona el CUERPO de un pedido — probado contra una instancia
  # real: con CONTAINERS=1 habilitado (imprescindible para que
  # sandbox_runner pueda lanzar contenedores efímeros), un
  # `docker run --privileged -v /:/host` sigue funcionando A TRAVÉS del
  # proxy. O sea, esto NO cierra por sí solo el escenario "sandbox_runner
  # comprometido crea un contenedor privilegiado con la raíz del host
  # montada" — esa garantía depende de que el CÓDIGO de sandbox_runner
  # nunca pida eso (docker_runner.py nunca setea privileged=True ni
  # monta host paths arbitrarios), no de este proxy. Lo que el proxy sí
  # cierra es el resto de la superficie de la API de Docker que
  # sandbox_runner no necesita para nada. Ver docs/HISTORY.md para el
  # detalle completo de esta verificación.
  docker_socket_proxy:
    image: tecnativa/docker-socket-proxy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # el único servicio que toca el socket real
    environment:
      - CONTAINERS=1   # crear/listar/inspeccionar/parar/eliminar contenedores efímeros
      - IMAGES=1        # pull/inspeccionar la imagen base y las imágenes cacheadas por skill
      - BUILD=1         # skill_image_builder.py / selfmod_test_image_builder.py construyen imágenes
      - POST=1          # interruptor maestro: sin esto, TODAS las escrituras se rechazan
      - NETWORKS=0
      - VOLUMES=0
      - EXEC=0
      - SWARM=0
      - SYSTEM=0
      - AUTH=0
      - SECRETS=0
      - PLUGINS=0
    networks:
      - sandbox_net
    # M-11 (auditoría externa Likay-OS, 2026-09-26): `sandbox_net` es
    # una red PROPIA, separada de `agent_net` — este proxy no tiene
    # ninguna autenticación suya (tecnativa/docker-socket-proxy no la
    # ofrece de fábrica sin configurar TLS de cliente aparte), así que
    # la única barrera real hoy es de qué red puede alcanzarlo. Antes,
    # compartía `agent_net` con el contenedor `agent` — cualquiera ahí
    # podía hablarle directo a Docker, sin pasar por `sandbox_runner`.
    # Sin puertos publicados al host: solo alcanzable desde sandbox_net.

  sandbox_runner:
    build:
      context: .
      dockerfile: kernel/lifecycle/Dockerfile
    # env_file: hallazgo C-3 (auditoría externa Likay-OS, 2026-09-26):
    # POST /execute (kernel/api/sandbox_api.py) corría código arbitrario
    # sin autenticación, alcanzable desde cualquier servicio de
    # agent_net. SANDBOX_RUNNER_SECRET (definida en .env, mismo valor
    # que lee `agent`) ahora se exige en el header X-Sandbox-Secret.
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://docker_socket_proxy:2375  # nunca el socket real, ver proxy arriba
      - SANDBOX_NETWORK_MODE=none
      - SANDBOX_MEMORY_LIMIT=512m
      - SANDBOX_CPU_LIMIT=1.0
      - SANDBOX_TIMEOUT_SECONDS=30
      - SANDBOX_PIDS_LIMIT=64
    depends_on:
      - docker_socket_proxy
    networks:
      - sandbox_net
    # Este servicio es el único con privilegios para lanzar contenedores
    # efímeros. Superficie de ataque aislada del resto del sistema — ver
    # M-11 arriba: `sandbox_net` es una red propia, sin `agent` adentro.
    # Sin puertos publicados al host: sandbox_api.py solo se alcanza vía
    # sandbox_net, nunca desde afuera (y ahora además exige
    # SANDBOX_RUNNER_SECRET, ver C-3 arriba).

  vector_store:
    image: chromadb/chroma:latest
    volumes:
      - ./data/long_term:/chroma/chroma
    networks:
      - agent_net
    # Sin puertos expuestos al host: solo accesible desde agent_net

networks:
  agent_net:
    driver: bridge
    internal: false  # true en producción si no se necesita salida a internet
  # M-11 (auditoría externa Likay-OS, 2026-09-26): red propia para
  # sandbox_runner/docker_socket_proxy, separada de agent_net — `agent`
  # no participa acá, así que no tiene ninguna ruta de red hacia el
  # proxy de Docker aunque su propio proceso se comprometa.
  sandbox_net:
    driver: bridge
    internal: true  # nunca necesita salida directa a internet propia
