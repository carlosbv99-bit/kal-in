name: CI

# Pipeline general (tests + lint) en cada push/PR — a diferencia de
# validate-skills.yml (que solo corre cuando cambia skills/**), este
# corre siempre. Instala requirements-core.lock + requirements-dev.lock
# (ver M-9 más abajo: versiones exactas + hashes, resueltos desde
# requirements-core.txt + requirements-dev.txt) a
# propósito, SIN requirements-multimodal.txt (diffusers/accelerate/
# piper-tts/faster-whisper/rembg/playwright/sentence-transformers/
# moviepy/huggingface_hub — la parte ML pesada, varios GB): los tests
# que las necesitan usan `pytest.importorskip(...)` y se saltan solos en
# vez de fallar (ver tests/test_memory_manager.py, tests/test_image_gen.py,
# etc.) — así el feedback rápido no depende de descargar modelos
# pesados en cada corrida. chromadb y Pillow SÍ están en
# requirements-core.txt pese a ser "multimodal" en espíritu — son
# necesarios para que la suite entera colecte, no solo para memoria de
# largo plazo (ver docs/HISTORY.md). La cobertura real end-to-end de la
# parte pesada (SDXL-Turbo, whisper, piper, etc.) queda para un job
# nocturno separado (nightly.yml, todavía no implementado).
#
# Docker SÍ está disponible por defecto en runners ubuntu-latest (sin
# necesidad de servicios extra ni de construir una imagen) — los tests
# marcados con `requires_docker` (ver tests/conftest.py) corren de
# verdad acá, no se saltan.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # clamav (binario clamscan, no un daemon) — necesario para los
      # tests reales de escaneo de artefactos de skills (fail-closed
      # por diseño, ver tool_integration/malware_scan.py); sin esto
      # esos tests puntuales rechazarían el escaneo en vez de pasar.
      - name: Instalar ClamAV
        run: sudo apt-get update && sudo apt-get install -y clamav

      # M-9 (auditoría externa Likay-OS, 2026-09-26): requirements-*.txt
      # nunca fijaba versiones exactas ni hashes — un paquete
      # comprometido/republicado bajo el mismo rango se instalaba en
      # silencio. requirements-*.lock (generado con
      # `uv pip compile --universal --python-version 3.12
      # --generate-hashes`, resolución universal multi-plataforma
      # fijada al piso real de Python que exige este mismo workflow,
      # no a la máquina donde se generó) + --require-hashes: pip
      # rechaza cualquier paquete cuyo hash no coincida exactamente
      # con el fijado acá. Regenerar con el mismo comando de arriba
      # cuando haga falta actualizar una dependencia — nunca a mano.
      - name: Instalar dependencias (core + dev, sin el stack multimodal)
        run: pip install --require-hashes -r requirements-core.lock -r requirements-dev.lock

      - name: Lint (solo errores reales — sintaxis/pyflakes, no estilo)
        run: python -m ruff check --select=E9,F .

      # Agregado 2026-09-27, preparando una auditoría externa — antes no
      # había ningún scanning de vulnerabilidades de dependencias. NO
      # bloqueante todavía a propósito: ya hay un hallazgo real conocido
      # (chromadb 1.5.9, la última versión publicada, sin fix disponible
      # — PYSEC-2026-311/3813/3814/3815, todos sobre el servidor HTTP
      # multi-tenant de chromadb, ver docs/HISTORY.md para el análisis
      # completo de por qué no aplica al modo `embedded`, el default de
      # este proyecto) — bloquear el build por algo sin fix disponible
      # no ayudaría a nadie. Igual corre y reporta en cada push/PR, para
      # que una vulnerabilidad NUEVA en cualquier otra dependencia no
      # pase desapercibida.
      - name: Auditoría de dependencias (reporta, no bloquea todavía)
        run: |
          pip install -q pip-audit
          pip-audit -r requirements-core.lock -r requirements-dev.lock || true

      - name: Tests
        run: python -m pytest tests/ -q
